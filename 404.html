<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KnitCult — We'll be right back</title>
<meta name="description" content="KnitCult is taking a short break. We'll be right back.">
<meta name="robots" content="noindex">
<meta property="og:title" content="KnitCult — We'll be right back">
<meta property="og:description" content="Collector grade soccer jerseys. We're taking a short break and will be back soon.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0D0D0D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230D0D0D'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='900' font-size='30' text-anchor='middle' fill='%23fff'%3EKC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0D0D0D;--surface:#161616;--border:#333;--text:#fff;--muted:#A1A1AA;--accent:#E2E8F0;--live:#22C55E}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh;
    background-image:radial-gradient(ellipse at 50% 0%,#1c1c1c 0%,transparent 60%)}
  header{padding:32px 40px;font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:.28em;font-size:14px;text-transform:uppercase}
  header span{color:var(--muted);font-weight:500}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{max-width:640px;width:100%;text-align:center}
  .pill{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--surface);
    padding:8px 16px;border-radius:999px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{opacity:.6;box-shadow:0 0 0 8px rgba(34,197,94,0)}}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(44px,9vw,84px);line-height:1;letter-spacing:-.03em;margin:32px 0 24px}
  p{color:var(--muted);font-size:clamp(16px,2.4vw,18px);line-height:1.65;max-width:480px;margin:0 auto}
  .rule{height:1px;background:var(--border);max-width:120px;margin:40px auto}
  .contact{font-size:14px;color:var(--muted)}
  .contact a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--border);padding-bottom:2px;transition:border-color .2s}
  .contact a:hover,.contact a:focus-visible{border-color:var(--accent);outline:none}
  footer{padding:24px;text-align:center;font-size:12px;color:#5b5b63;letter-spacing:.06em}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
  @media (max-width:480px){header{padding:24px}}
</style>
</head>
<body>
<header>Knit<span>Cult</span></header>
<main>
  <div class="wrap">
    <div class="pill" data-testid="status-pill"><span class="dot" aria-hidden="true"></span>Taking a short break</div>
    <h1>We'll be<br>right back.</h1>
    <p>The store is offline while we make some improvements. Your favourite collector grade jerseys will be waiting when we return.</p>
    <div class="rule" aria-hidden="true"></div>

  </div>
</main>
<footer>&copy; KnitCult</footer>
</body>
</html>
